<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Chat Support | Automated Tax Filing Guide</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .chat-container {
      display: flex;
      height: 100vh;
      gap: 20px;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .chat-list {
      width: 300px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }

    .chat-list h2 {
      margin: 0 0 20px 0;
      color: #333;
      font-size: 18px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .chat-item {
      padding: 12px;
      margin-bottom: 10px;
      background: #f5f5f5;
      border-left: 4px solid #667eea;
      cursor: pointer;
      border-radius: 5px;
      transition: all 0.3s ease;
    }

    .chat-item:hover {
      background: #e8e8ff;
      transform: translateX(5px);
    }

    .chat-item.active {
      background: #667eea;
      color: white;
    }

    .chat-item-title {
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .chat-item-meta {
      font-size: 12px;
      opacity: 0.7;
    }

    .chat-main {
      flex: 1;
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .chat-header {
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 15px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h3 {
      margin: 0;
      color: #333;
    }

    .chat-status {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-open {
      background: #d4edda;
      color: #155724;
    }

    .status-in-progress {
      background: #fff3cd;
      color: #856404;
    }

    .status-resolved {
      background: #d1ecf1;
      color: #0c5460;
    }

    .status-closed {
      background: #f8d7da;
      color: #721c24;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 15px;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 8px;
    }

    .message {
      margin-bottom: 15px;
      display: flex;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.support {
      justify-content: flex-start;
    }

    .message-content {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 10px;
      word-wrap: break-word;
    }

    .user .message-content {
      background: #667eea;
      color: white;
    }

    .support .message-content {
      background: #e8e8ff;
      color: #333;
    }

    .message-time {
      font-size: 11px;
      margin-top: 5px;
      opacity: 0.6;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    .input-area textarea {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      resize: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 14px;
      min-height: 80px;
    }

    .input-area textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .input-area button {
      padding: 12px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .input-area button:hover {
      background: #764ba2;
      transform: translateY(-2px);
    }

    .new-chat-form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .new-chat-form h3 {
      color: #333;
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-weight: 600;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      box-sizing: border-box;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-actions {
      display: flex;
      gap: 10px;
    }

    .form-actions button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #764ba2;
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #999;
    }

    .empty-state p {
      font-size: 16px;
      margin: 10px 0;
    }

    .nav-bar {
      background: white;
      padding: 15px 20px;
      border-bottom: 2px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-bar a {
      margin-right: 15px;
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .nav-bar a:hover {
      color: #764ba2;
    }

    .loader {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(102, 126, 234, 0.3);
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .chat-container {
        flex-direction: column;
      }

      .chat-list {
        width: 100%;
        max-height: 200px;
      }

      .message-content {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="nav-bar">
    <div>
      <a href="dashboard.html">Dashboard</a>
      <a href="chat.html" style="color: #764ba2; border-bottom: 3px solid #764ba2;">Live Chat</a>
    </div>
    <div>
      <a href="#" onclick="logoutUser()">Logout</a>
    </div>
  </div>

  <div class="chat-container">
    <!-- Chat List -->
    <div class="chat-list">
      <h2>Your Chats</h2>
      <div id="chatsList">
        <p style="text-align: center; color: #999;">Loading...</p>
      </div>
      <button class="btn-primary" style="margin-top: auto; width: 100%;" onclick="showNewChatForm()">+ New Chat</button>
    </div>

    <!-- Chat Main Area -->
    <div class="chat-main" id="chatMain">
      <div class="empty-state">
        <p>👋 Welcome to Live Chat Support</p>
        <p>Select a chat from the list or start a new conversation</p>
      </div>
    </div>
  </div>

  <!-- New Chat Modal -->
  <div id="newChatModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); align-items: center; justify-content: center; z-index: 1000;">
    <div class="new-chat-form" style="width: 90%; max-width: 500px;">
      <h3>Start a New Chat</h3>
      <form id="newChatForm" onsubmit="createNewChat(event)">
        <div class="form-group">
          <label for="subject">Subject *</label>
          <input type="text" id="subject" placeholder="What do you need help with?" required>
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="general-inquiry">General Inquiry</option>
            <option value="tax-help">Tax Help</option>
            <option value="technical-issue">Technical Issue</option>
            <option value="account-issue">Account Issue</option>
          </select>
        </div>
        <div class="form-group">
          <label for="initialMessage">Message *</label>
          <textarea id="initialMessage" placeholder="Tell us more about your issue..." required></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-secondary" onclick="closeNewChatForm()">Cancel</button>
          <button type="submit" class="btn-primary">Start Chat</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/chat.js"></script>
</body>
</html>
