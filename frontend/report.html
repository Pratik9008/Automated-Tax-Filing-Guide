<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report | Automated Tax Filing Guide</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="vendor/jspdf.umd.min.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div><p class="eyebrow">Automated Tax Filing Guide</p><h1>PDF Report</h1></div>
      <div class="app-actions">
        <a class="ghost-button" href="dashboard.html">Dashboard</a>
        <a class="ghost-button" href="income.html">Income</a>
        <a class="ghost-button" href="expense.html">Deductions</a>
        <button class="icon-button" type="button" data-theme-toggle aria-label="Toggle dark mode" title="Toggle dark mode">T</button>
        <button class="ghost-button" type="button" id="logoutButton">Logout</button>
      </div>
    </header>

    <section class="dashboard-hero">
      <div>
        <p class="eyebrow">Downloadable tax report</p>
        <h2>Automated Tax Filing Guide</h2>
        <p class="brand-copy">Generate a PDF with income, deductions, old vs new regime comparison, recommendation and AI tax tips.</p>
      </div>
      <div>
        <select id="reportYear"><option>FY 2024-25</option><option>FY 2023-24</option></select>
        <button class="primary-button hero-action" type="button" id="generateReportButton"><span>Generate PDF</span><span class="spinner"></span></button>
      </div>
    </section>
  </main>
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pdf.js"></script>
</body>
</html>
